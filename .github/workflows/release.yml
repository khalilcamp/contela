name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Gerar os instaladores do Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contela-fe/package-lock.json

      - name: Conferir que a tag bate com a versão do package.json
        working-directory: contela-fe
        shell: bash
        run: |
          versao_pacote=$(node -p "require('./package.json').version")
          versao_tag="${GITHUB_REF_NAME#v}"
          if [ "$versao_pacote" != "$versao_tag" ]; then
            echo "A tag ($GITHUB_REF_NAME) não bate com a versão do package.json ($versao_pacote)."
            exit 1
          fi

      - name: Instalar dependências
        working-directory: contela-fe
        run: npm ci

      - name: Build do front (export estático) e empacotamento
        working-directory: contela-fe
        shell: bash
        env:
          NEXT_PUBLIC_WS_URL: ${{ vars.WS_URL }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.WEB_URL }}
          ELECTRON: "1"
        run: |
          if [ -z "$NEXT_PUBLIC_WS_URL" ]; then
            echo "Defina a variável de repositório WS_URL (ex: https://seu-backend.onrender.com/wsock)."
            exit 1
          fi
          npx next build
          npx electron-builder --win --publish never

      - name: Publicar o Release com os instaladores
        working-directory: contela-fe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-electron/*.exe dist-electron/*.exe.blockmap dist-electron/latest.yml\
            --repo "$GITHUB_REPOSITORY" \
            --title "Contela ${GITHUB_REF_NAME#v}" \
            --generate-notes
